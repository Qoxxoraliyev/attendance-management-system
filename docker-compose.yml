version: "3.8"

services:
  app:
    build: .
    container_name: attendance_app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/attendance_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1984
    restart: always

  mysql:
    image: mysql:8
    container_name: attendance_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1984
      MYSQL_DATABASE: attendance_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
    mysql_data: